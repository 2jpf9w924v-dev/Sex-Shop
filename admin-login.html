<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>LUMÉ Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 10%, #3b0a23, #090b10 45%);
      font-family: Arial;
      color: #fff;
    }

    .card {
      width: min(430px, 92vw);
      background: #11141b;
      border: 1px solid #2b2f3a;
      border-radius: 24px;
      padding: 34px;
      box-shadow: 0 30px 100px #0009;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 28px;
    }

    .logo span {
      color: #ff2f7d;
    }

    h1 {
      font-size: 24px;
    }

    p {
      color: #9ca3af;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #303642;
      background: #0b0e14;
      color: #fff;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #f42678;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: .65;
      cursor: wait;
    }

    .msg {
      margin-top: 14px;
      color: #ff789f;
    }

    .msg.success {
      color: #6ee7a8;
    }
  </style>
</head>

<body>

  <form class="card" id="form">

    <div class="logo">
      <span>♥</span> LUMÉ
    </div>

    <h1 id="title">
      Acesso administrativo
    </h1>

    <p id="desc">
      Entre para gerenciar a loja.
    </p>

    <div id="nameBox" style="display:none">

      <label for="name">
        Nome
      </label>

      <input
        id="name"
        name="admin_name"
        type="text"
        autocomplete="name"
      >

    </div>

    <label for="email">
      E-mail
    </label>

    <input
      id="email"
      name="email"
      type="email"
      required
      autocomplete="username"
    >

    <label for="password">
      Senha
    </label>

    <input
      id="password"
      name="password"
      type="password"
      required
      autocomplete="current-password"
    >

    <button
      id="btn"
      type="submit"
    >
      Entrar
    </button>

    <div
      class="msg"
      id="msg"
    ></div>

  </form>

  <script>
    let setup = false;

    // =========================================================
    // ELEMENTOS DA TELA
    // =========================================================

    const formEl = document.getElementById('form');
    const nameEl = document.getElementById('name');
    const emailEl = document.getElementById('email');
    const passwordEl = document.getElementById('password');

    const nameBoxEl = document.getElementById('nameBox');

    const titleEl = document.getElementById('title');
    const descEl = document.getElementById('desc');

    const btnEl = document.getElementById('btn');
    const msgEl = document.getElementById('msg');


    // =========================================================
    // VERIFICA SE PRECISA CRIAR O PRIMEIRO ADMIN
    // =========================================================

    async function verificarSetup() {

      try {

        const response = await fetch(
          '/api/admin?action=setup',
          {
            method: 'GET',
            cache: 'no-store'
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            'Não foi possível verificar o administrador.'
          );
        }

        setup = Boolean(data.setup_required);

        if (setup) {

          titleEl.textContent =
            'Criar primeiro administrador';

          descEl.textContent =
            'Configuração inicial da LUMÉ. Esta tela será bloqueada após criar o primeiro dono.';

          nameBoxEl.style.display = 'block';

          nameEl.required = true;

          btnEl.textContent =
            'Criar administrador';

          passwordEl.autocomplete =
            'new-password';

        } else {

          nameBoxEl.style.display = 'none';

          nameEl.required = false;

          titleEl.textContent =
            'Acesso administrativo';

          descEl.textContent =
            'Entre para gerenciar a loja.';

          btnEl.textContent =
            'Entrar';

          passwordEl.autocomplete =
            'current-password';
        }

      } catch (error) {

        msgEl.textContent =
          error.message ||
          'Erro ao verificar configuração.';
      }
    }


    // =========================================================
    // ENVIO DO FORMULÁRIO
    // =========================================================

    formEl.addEventListener(
      'submit',
      async function (event) {

        event.preventDefault();

        msgEl.textContent = '';
        msgEl.classList.remove('success');

        btnEl.disabled = true;

        try {

          const emailValue =
            emailEl.value.trim();

          const passwordValue =
            passwordEl.value;

          const body = {
            email: emailValue,
            password: passwordValue
          };


          // ===================================================
          // SETUP
          // ===================================================

          if (setup) {

            const nameValue =
              nameEl.value.trim();

            if (nameValue.length < 2) {
              throw new Error(
                'Informe seu nome.'
              );
            }

            if (passwordValue.length < 10) {
              throw new Error(
                'A senha precisa ter pelo menos 10 caracteres.'
              );
            }

            // IMPORTANTE:
            // o nome agora é obtido explicitamente pelo ID.
            body.name = nameValue;
          }


          // ===================================================
          // REQUISIÇÃO
          // ===================================================

          const endpoint = setup
            ? '/api/admin?action=setup'
            : '/api/admin?action=login';

          const response = await fetch(
            endpoint,
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'application/json'
              },

              body:
                JSON.stringify(body)
            }
          );


          let data = {};

          try {
            data = await response.json();
          } catch {
            throw new Error(
              'Resposta inválida do servidor.'
            );
          }


          if (!response.ok) {

            throw new Error(
              data.error ||
              'Não foi possível concluir a operação.'
            );
          }


          // ===================================================
          // ADMIN CRIADO
          // ===================================================

          if (setup) {

            setup = false;

            titleEl.textContent =
              'Administrador criado';

            descEl.textContent =
              'Agora faça seu primeiro login.';

            nameBoxEl.style.display =
              'none';

            nameEl.required = false;

            btnEl.textContent =
              'Entrar';

            passwordEl.value = '';

            passwordEl.autocomplete =
              'current-password';

            msgEl.classList.add(
              'success'
            );

            msgEl.textContent =
              'Conta criada com sucesso. Agora informe sua senha para entrar.';

            return;
          }


          // ===================================================
          // LOGIN REALIZADO
          // ===================================================

          window.location.href =
            '/admin.html';

        } catch (error) {

          msgEl.classList.remove(
            'success'
          );

          msgEl.textContent =
            error.message ||
            'Erro inesperado.';

        } finally {

          btnEl.disabled = false;
        }
      }
    );


    // =========================================================
    // INICIALIZAÇÃO
    // =========================================================

    verificarSetup();
  </script>

</body>
</html>
