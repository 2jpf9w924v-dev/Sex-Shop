<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMÉ Admin</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#3b0a23,#090b10 45%);font-family:Arial;color:#fff}.card{width:min(430px,92vw);background:#11141b;border:1px solid #2b2f3a;border-radius:24px;padding:34px;box-shadow:0 30px 100px #0009}.logo{font-size:30px;font-weight:800;margin-bottom:28px}.logo span{color:#ff2f7d}h1{font-size:24px}p{color:#9ca3af}label{display:block;margin:15px 0 7px;font-size:13px}input{width:100%;padding:14px;border-radius:12px;border:1px solid #303642;background:#0b0e14;color:#fff}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:#f42678;color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:14px;color:#ff789f}</style></head><body><form class="card" id="form"><div class="logo"><span>♥</span> LUMÉ</div><h1 id="title">Acesso administrativo</h1><p id="desc">Entre para gerenciar a loja.</p><div id="nameBox" style="display:none"><label>Nome</label><input id="name" autocomplete="name"></div><label>E-mail</label><input id="email" type="email" required autocomplete="username"><label>Senha</label><input id="password" type="password" required autocomplete="current-password"><button id="btn">Entrar</button><div class="msg" id="msg"></div></form><script>let setup=false;(async()=>{try{const r=await fetch('/api/admin-setup'),d=await r.json();setup=!!d.setup_required;if(setup){title.textContent='Criar primeiro administrador';desc.textContent='Configuração inicial da LUMÉ. Esta tela será bloqueada após criar o primeiro dono.';nameBox.style.display='block';btn.textContent='Criar administrador';password.autocomplete='new-password'}}catch(e){}})();form.onsubmit=async e=>{e.preventDefault();btn.disabled=true;msg.textContent='';const body={email:email.value,password:password.value};if(setup)body.name=name.value;try{const r=await fetch(setup?'/api/admin-setup':'/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.error||'Falha');if(setup){setup=false;title.textContent='Administrador criado';desc.textContent='Agora faça seu primeiro login.';nameBox.style.display='none';btn.textContent='Entrar';password.value='';msg.textContent='Conta criada com sucesso.'}else location.href='/admin.html'}catch(x){msg.textContent=x.message}finally{btn.disabled=false}};</script></body></html>
