<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamento | LUMÉ</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#4d0b23,#08090a 52%);color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(560px,92vw);background:#101113;border:1px solid #512033;border-radius:24px;padding:42px;text-align:center;box-shadow:0 24px 80px #0008}.logo{font-family:Georgia;font-size:34px}.logo i{color:#ff3977}.icon{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:28px auto;font-size:36px;background:#ff39771c;border:1px solid #ff3977}.muted{color:#aaa;line-height:1.6}.details{margin:24px 0;padding:16px;background:#090a0b;border-radius:14px;color:#ccc;text-align:left}.btn{display:inline-block;background:#ff3977;color:white;text-decoration:none;border-radius:999px;padding:14px 24px;font-weight:700}</style></head><body><main class="box"><div class="logo"><i>♥</i> LUMÉ</div><div class="icon" id="icon">✓</div><h1 id="title">Validando pagamento…</h1><p class="muted" id="msg">Aguarde enquanto confirmamos diretamente com o Mercado Pago.</p><div class="details" id="details" style="display:none"></div><a class="btn" href="/">Voltar para a LUMÉ</a></main><script>(async()=>{const q=new URLSearchParams(location.search);let id=q.get('order_id');if(!id){try{id=JSON.parse(localStorage.getItem('lumeLastOrder')||'{}').order_id}catch{}}if(!id){title.textContent='Retorno recebido';msg.textContent='Não foi possível identificar o pedido para validação.';return}try{const r=await fetch('/api/order?action=sync&order_id='+encodeURIComponent(id)),d=await r.json();if(!r.ok)throw new Error(d.error||'Falha na validação');if(d.status==='processed'){title.textContent='Pagamento efetuado!';msg.textContent='Pagamento confirmado. Seu pedido já está registrado na LUMÉ.';details.style.display='block';details.innerHTML='<b>Pedido:</b> '+(d.external_reference||'—')+'<br><b>Status:</b> '+(d.status_detail||'processed')+'<br><b>Mensageria:</b> confirmação processada pelo servidor.';localStorage.removeItem('lumeCart');localStorage.removeItem('lumePendingOrder')}else{icon.textContent='…';title.textContent='Pagamento em análise';msg.textContent='Status atual: '+(d.status||'desconhecido')+'. Seu carrinho foi preservado.'}}catch(e){icon.textContent='!';title.textContent='Não foi possível validar agora';msg.textContent='Seu pedido foi criado e o carrinho foi preservado. '+e.message}})()</script></body></html>
