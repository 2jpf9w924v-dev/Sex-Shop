<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamento | LUMÉ</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#4d0b23,#08090a 52%);color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(560px,92vw);background:#101113;border:1px solid #512033;border-radius:24px;padding:42px;text-align:center;box-shadow:0 24px 80px #0008}.logo{font-family:Georgia;font-size:34px}.logo i{color:#ff3977}.icon{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:28px auto;font-size:36px;background:#ff39771c;border:1px solid #ff3977}.muted{color:#aaa;line-height:1.6}.details{margin:24px 0;padding:16px;background:#090a0b;border-radius:14px;color:#ccc;text-align:left}.btn{display:inline-block;background:#ff3977;color:white;text-decoration:none;border-radius:999px;padding:14px 24px;font-weight:700}</style></head><body><main class="box"><div class="logo"><i>♥</i> LUMÉ</div><div class="icon" id="icon">✓</div><h1 id="title">Validando pagamento…</h1><p class="muted" id="msg">Aguarde enquanto confirmamos a order diretamente com o Mercado Pago.</p><div class="details" id="details" style="display:none"></div><a class="btn" href="/">Voltar para a LUMÉ</a></main><script>(async()=>{const q=new URLSearchParams(location.search);let id=q.get('order_id');if(!id){try{id=JSON.parse(localStorage.getItem('lumeLastOrder')||'{}').order_id}catch(e){}}if(!id){title.textContent='Retorno recebido';msg.textContent='Não foi possível identificar a order para validação.';return}try{const r=await fetch('/api/order-status?order_id='+encodeURIComponent(id)),d=await r.json();if(d.status==='processed'){title.textContent='Pagamento efetuado!';msg.textContent='Pagamento confirmado pelo Mercado Pago. Obrigado pela sua compra.';details.style.display='block';let delivery='';try{const po=JSON.parse(localStorage.getItem('lumePendingOrder')||'{}'),c=po.customer||{};if(c.name)delivery='<br><br><b>Entrega:</b> '+c.name+'<br>'+c.street+', '+c.number+(c.complement?' - '+c.complement:'')+'<br>'+c.district+' · '+c.city+'/'+c.uf+' · CEP '+c.cep}catch(e){}details.innerHTML='<b>Order:</b> #'+d.id+'<br><b>Pedido:</b> '+(d.external_reference||'—')+'<br><b>Status:</b> '+(d.status_detail||'processed')+delivery;try{const po=JSON.parse(localStorage.getItem('lumePendingOrder')||'{}');if(po.customer&&Array.isArray(po.items)){const er=await fetch('/api/send-order-emails',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:id,customer:po.customer,items:po.items.map(x=>({id:x.id,quantity:x.quantity}))})});const et=await er.text();let ej={};try{ej=et?JSON.parse(et):{}}catch(e){}if(er.ok||er.status===207){details.innerHTML+='<br><br><b>Confirmação:</b> '+(ej.customer_email_sent?'E-mail enviado para você e para a loja.':'Pedido enviado para a loja. O e-mail do cliente não pôde ser enviado.')}else{console.error('Falha na mensageria',ej||et)}}}catch(e){console.error('Falha ao disparar e-mails',e)}localStorage.removeItem('lumeCart');localStorage.removeItem('lumePendingOrder');setTimeout(()=>location.href='/',8000)}else{icon.textContent='…';title.textContent='Pagamento em análise';msg.textContent='A order está com status '+(d.status||'desconhecido')+'. Seu carrinho foi preservado.'}}catch(e){msg.textContent='Não foi possível validar a order agora. Seu carrinho foi preservado.'}})()</script></body></html>
